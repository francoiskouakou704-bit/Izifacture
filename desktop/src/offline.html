<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>iziFacture — Hors connexion</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fafbfc;
        color: #0f172a;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 360px;
        padding: 24px;
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: #0d1326;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 22px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        color: #64748b;
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 9999px;
        padding: 12px 28px;
        background: #0d1326;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      button:active {
        transform: scale(0.96);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f1117;
          color: #e2e8f0;
        }
        .logo,
        button {
          background: #fff;
          color: #0d1326;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">iF</div>
      <h1>Pas de connexion Internet</h1>
      <p>iziFacture a besoin d’Internet pour synchroniser vos factures. Vérifiez votre connexion puis réessayez.</p>
      <button id="retry" type="button">Réessayer</button>
    </main>
    <script>
      const target = new URLSearchParams(location.search).get('target')
      const retry = () => target && /^https?:\/\//.test(target) && location.replace(target)
      document.getElementById('retry').addEventListener('click', retry)
      // Retour de la connexion : nouvelle tentative automatique
      window.addEventListener('online', retry)
    </script>
  </body>
</html>
